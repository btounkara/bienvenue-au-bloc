# Configuration de l'espace d'écriture (Pages CMS : https://app.pagescms.org)
media:
  input: src/images/publications
  output: /images/publications

content:
  - name: portraits
    label: "Ceux qui font le bloc"
    type: collection
    path: src/portraits
    extension: md
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, metier, date, brouillon]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: "Titre (ex. Camille, IADE : « Au bloc, on ne travaille jamais seule »)"
        type: string
        required: true
      - name: date
        label: "Date de publication"
        type: date
        required: true
      - name: prenom
        label: "Prénom de la personne"
        type: string
      - name: metier
        label: "Métier (ex. IBODE, IADE, chirurgien, aide-soignante…)"
        type: string
        required: true
      - name: resume
        label: "Résumé (2 lignes affichées sur la page d'accueil)"
        type: text
        required: true
      - name: image
        label: "Photo ou illustration (facultative)"
        type: image
      - name: youtube
        label: "Lien YouTube de la vidéo (facultatif) - copiez l'adresse de la vidéo"
        type: string
      - name: spotify
        label: "Lien Spotify de l'épisode, facultatif (Partager > Copier le lien de l'épisode)"
        type: string
      - name: duree
        label: "Durée de la vidéo ou de l'audio, en minutes"
        type: number
      - name: body
        label: "Présentation de la personne (son parcours en quelques lignes)"
        type: rich-text
      - name: moments
        label: "Les moments clés"
        type: object
        list: true
        fields:
          - name: temps
            label: "Minutage (ex. 04:30)"
            type: string
          - name: sujet
            label: "De quoi on parle"
            type: string
      - name: citations
        label: "Les phrases à retenir"
        type: text
        list: true
      - name: instagram
        label: "Lien de la publication Instagram (facultatif)"
        type: string
      - name: brouillon
        label: "Brouillon (cochée = invisible sur le site)"
        type: boolean
        default: true

  - name: erreurs
    label: "Si c'était à refaire"
    type: collection
    path: src/erreurs
    extension: md
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, prenom, date, brouillon]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: "Titre (ex. Le compte des compresses transmis trop vite)"
        type: string
        required: true
      - name: date
        label: "Date de publication"
        type: date
        required: true
      - name: resume
        label: "Résumé (2 lignes affichées sur la page d'accueil)"
        type: text
        required: true
      - name: prenom
        label: "Prénom de la personne (laissez vide pour un témoignage anonyme)"
        type: string
      - name: metier
        label: "Métier et expérience (ex. IBODE, 2 ans d'expérience)"
        type: string
      - name: photo
        label: "1. Photo de présentation de la personne (facultative, elle sert aussi d'image sur la page d'accueil)"
        type: image
      - name: presentation
        label: "2. Son expérience au bloc opératoire (premier paragraphe)"
        type: rich-text
      - name: body
        label: "3. Son témoignage"
        type: rich-text
      - name: mot_de_la_fin
        label: "4. Le mot de la fin : votre synthèse et vos conseils"
        type: rich-text
      - name: photos
        label: "5. Photos des bonnes pratiques et recommandations (facultatif, affichées en fin d'article)"
        type: object
        list: true
        fields:
          - name: image
            label: "Photo"
            type: image
          - name: legende
            label: "Légende (ce que montre la photo)"
            type: string
      - name: instagram
        label: "Lien de la publication Instagram (facultatif)"
        type: string
      - name: brouillon
        label: "Brouillon (cochée = invisible sur le site)"
        type: boolean
        default: true

  - name: premieres-fois
    label: "La première fois où j'ai…"
    type: collection
    path: src/premieres-fois
    extension: md
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, prenom, date, brouillon]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: "Titre (ex. La première fois où j'ai instrumenté seule)"
        type: string
        required: true
      - name: date
        label: "Date de publication"
        type: date
        required: true
      - name: resume
        label: "Résumé (2 lignes affichées sur la page d'accueil)"
        type: text
        required: true
      - name: prenom
        label: "Prénom de la personne (laissez vide pour un témoignage anonyme)"
        type: string
      - name: metier
        label: "Métier et expérience (ex. IBODE, 6 ans de bloc)"
        type: string
      - name: photo
        label: "1. Photo de présentation de la personne (facultative, elle sert aussi d'image sur la page d'accueil)"
        type: image
      - name: presentation
        label: "2. Son expérience au bloc opératoire (premier paragraphe)"
        type: rich-text
      - name: body
        label: "3. Son témoignage"
        type: rich-text
      - name: mot_de_la_fin
        label: "4. Le mot de la fin : votre synthèse et vos conseils"
        type: rich-text
      - name: photos
        label: "5. Photos des bonnes pratiques et recommandations (facultatif, affichées en fin d'article)"
        type: object
        list: true
        fields:
          - name: image
            label: "Photo"
            type: image
          - name: legende
            label: "Légende (ce que montre la photo)"
            type: string
      - name: instagram
        label: "Lien de la publication Instagram (facultatif)"
        type: string
      - name: brouillon
        label: "Brouillon (cochée = invisible sur le site)"
        type: boolean
        default: true

  - name: accueil
    label: "Page d'accueil"
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - name: nom
        label: "Nom du blog"
        type: string
      - name: slogan
        label: "Slogan (à côté du nom, en haut)"
        type: string
      - name: description
        label: "Description pour Google"
        type: text
      - name: banniere
        label: "Grande image d'accueil"
        type: image
      - name: accroche_titre
        label: "Grand titre (mettez des *étoiles* autour des mots à colorer en rose)"
        type: string
      - name: accroche_texte
        label: "Phrase sous le grand titre"
        type: text
      - name: accroche_signature
        label: "Petite ligne sous la phrase"
        type: string
      - name: participer_titre
        label: "Titre de l'appel à témoigner"
        type: string
      - name: participer_texte
        label: "Texte de l'appel à témoigner"
        type: text
      - name: questionnaire_premiere_fois
        label: "Lien du questionnaire « La première fois où j'ai… » (laissez vide pour masquer le bouton)"
        type: string
      - name: questionnaire_refaire
        label: "Lien du questionnaire « Si c'était à refaire » (laissez vide pour masquer le bouton)"
        type: string
      - name: instagram
        label: "Lien de votre compte Instagram"
        type: string
      - name: email
        label: "Adresse e-mail de contact (facultative, elle sera visible par tous)"
        type: string
      - name: presentation_titre
        label: "Titre de la présentation"
        type: string
      - name: portrait
        label: "Image de la présentation"
        type: image
      - name: presentation
        label: "Texte de la présentation"
        type: rich-text
      - name: signature
        label: "Votre signature"
        type: string
      - name: avertissement
        label: "Phrase en bas de page"
        type: text
      - name: goatcounter
        label: "Code GoatCounter pour compter les lecteurs (ex. bienvenueaubloc ; laissez vide pour ne rien compter)"
        type: string
      - name: compteur_visible
        label: "Afficher le nombre de lectures sous le titre des articles (cochée = visible par tous)"
        type: boolean
